name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Force Web Build (Skip Type Checking)
        run: |
          npx vite build --emptyOutDir || true
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            cp index.html dist/ 2>/dev/null || true
          fi

      - name: Setup Capacitor and Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Barbie Game" "com.rosvn.barbiegame" --web-dir "dist" --bundled-web-runtime false || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barbie-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
